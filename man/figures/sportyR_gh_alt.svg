<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!--
    sportyR social card, 1280x640. Part of the SportsDataverse card family:
    gradient field in the package's own brand color, a sport motif watermark,
    the wordmark, a tagline, and the gold divider + diamond that every card in
    the family shares. Generated by make_cards.py; edit the config there and
    re-render rather than hand-editing this file.
  -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C2A16"/>
      <stop offset="100%" stop-color="#04120A"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#field)"/>

  <g opacity="0.45">
    <g stroke="#2C6B3E" stroke-width="7" fill="none">
    <rect x="70" y="130" width="500" height="300" rx="6"/>
    <circle cx="320" cy="280" r="60"/>
    <path d="M320,130 V430"/>
    <rect x="70" y="215" width="110" height="130"/>
    <rect x="460" y="215" width="110" height="130"/>
    </g>
    <g stroke="#7BD87B" stroke-width="7" fill="none">
    <rect x="640" y="90" width="560" height="290" rx="80"/>
    <path d="M920,90 V380"/><circle cx="920" cy="235" r="52"/>
    <circle cx="760" cy="235" r="34"/><circle cx="1080" cy="235" r="34"/>
    </g>
    <g stroke="#7BD87B" stroke-width="7" fill="none" stroke-linejoin="round">
    <polygon points="200,580 300,480 200,380 100,480"/>
    <path d="M200,580 L60,440"/><path d="M200,580 L340,440"/>
    </g>
    <g stroke="#2C6B3E" stroke-width="7" fill="none">
    <rect x="440" y="430" width="760" height="160" rx="4"/>
    <path d="M520,430 V590"/>
    <path d="M600,430 V590"/>
    <path d="M680,430 V590"/>
    <path d="M760,430 V590"/>
    <path d="M840,430 V590"/>
    <path d="M920,430 V590"/>
    <path d="M1000,430 V590"/>
    <path d="M1080,430 V590"/>
    <path d="M1160,430 V590"/>
    </g>
  </g>

  <text x="640" y="352" text-anchor="middle" font-family="'DejaVu Sans','Segoe UI',Verdana,sans-serif"
        font-size="150" font-weight="700"
        stroke="#04120A" stroke-width="16" paint-order="stroke"><tspan fill="#FFFFFF">sportyR</tspan></text>

  <text x="640" y="430" text-anchor="middle" font-family="'DejaVu Sans','Segoe UI',Verdana,sans-serif"
        font-size="30" font-weight="600" fill="#7BD87B"
        letter-spacing="3">DRAW REGULATION PLAYING SURFACES IN R</text>

  <rect x="430" y="470" width="170" height="4" fill="#FFB612"/>
  <rect x="680" y="470" width="170" height="4" fill="#FFB612"/>
  <polygon points="640,454 658,472 640,490 622,472" fill="#FFB612"/>
  <text x="640" y="522" text-anchor="middle" font-family="'DejaVu Sans','Segoe UI',Verdana,sans-serif"
        font-size="26" font-weight="400" fill="#8FA3B5"
        letter-spacing="2">sportyR.sportsdataverse.org</text>
</svg>
