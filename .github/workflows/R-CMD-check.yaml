# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Only runs when something that R CMD check looks at changes, so docs-only and
# CI-only changes skip it. Use "Run workflow" in the Actions tab to force a run
on:
  push:
    branches: [main, master]
    paths: &check-paths
      - "R/**"
      - "src/**"
      - "data/**"
      - "tests/**"
      - "man/**"
      - "inst/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - ".Rbuildignore"
      - ".github/workflows/R-CMD-check.yaml"
  pull_request:
    branches: [main, master]
    paths: *check-paths
  workflow_dispatch:

name: R-CMD-check

# A new push to a pull request cancels that PR's stale run. Other runs (pushes to
# main, manual runs) get their own group so none is dropped from the queue
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    # The release and oldrel-1 ubuntu jobs run in a rocker/r-ver image that already
    # ships R, the system libraries and a Posit Package Manager binary repo, so
    # setup-r (and its slow apt-get install) is skipped. R-devel stays on setup-r:
    # its image is Ubuntu 26.04 and PPM has no R 4.7 binaries, so it compiled every
    # package from source (~15 min). Bump the tags when a new R minor is released
    container: ${{ matrix.config.container }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel',    http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release',  container: 'rocker/r-ver:4.6'}
          - {os: ubuntu-latest,   r: 'oldrel-1', container: 'rocker/r-ver:4.5'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        if: ${{ !matrix.config.container }}
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-vignettes", "--no-build-vignettes", "--ignore-vignettes", "--no-manual")'
          upload-snapshots: true
