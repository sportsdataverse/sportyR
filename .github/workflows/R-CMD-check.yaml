# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Only runs when something that R CMD check looks at changes, so docs-only and
# CI-only changes skip it. Use "Run workflow" in the Actions tab to force a run
on:
  push:
    branches: [main, master]
    paths: &check-paths
      - "R/**"
      - "src/**"
      - "data/**"
      - "tests/**"
      - "man/**"
      - "inst/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - ".Rbuildignore"
      - ".github/workflows/R-CMD-check.yaml"
  pull_request:
    branches: [main, master]
    paths: *check-paths
  workflow_dispatch:

name: R-CMD-check

# A new push to a pull request cancels that PR's stale run; pushes to main and
# manual runs always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-vignettes", "--no-build-vignettes", "--ignore-vignettes", "--no-manual")'
          upload-snapshots: true
