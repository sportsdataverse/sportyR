# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Only runs when something that R CMD check looks at changes, so docs-only and
# CI-only changes skip it. Use "Run workflow" in the Actions tab to force a run
on:
  push:
    branches: [main, master]
    paths: &check-paths
      - "R/**"
      - "src/**"
      - "data/**"
      - "tests/**"
      - "man/**"
      - "inst/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - ".Rbuildignore"
      - ".github/workflows/R-CMD-check.yaml"
  pull_request:
    branches: [main, master]
    paths: *check-paths
  workflow_dispatch:

name: R-CMD-check

# A new push to a pull request cancels that PR's stale run; pushes to main and
# manual runs always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    # Ubuntu jobs run in a rocker/r-ver image that already ships R, the system
    # libraries and a Posit Package Manager binary repo, so setup-r (and its slow
    # apt-get install) is skipped. Bump the tags when a new R minor is released
    container: ${{ matrix.config.container }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel',    container: 'rocker/r-ver:devel', http-user-agent: 'R/4.6.1 R (4.6.1 x86_64-pc-linux-gnu x86_64 linux-gnu)'}
          - {os: ubuntu-latest,   r: 'release',  container: 'rocker/r-ver:4.6'}
          - {os: ubuntu-latest,   r: 'oldrel-1', container: 'rocker/r-ver:4.5'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        if: ${{ !matrix.config.container }}
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # PPM has no binaries for R-devel, so identify as release R to get them
      # (what setup-r's http-user-agent input does outside a container)
      - name: Set HTTP user agent
        if: ${{ matrix.config.http-user-agent }}
        run: echo "options(HTTPUserAgent = '${{ matrix.config.http-user-agent }}')" >> "$(R RHOME)/etc/Rprofile.site"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-vignettes", "--no-build-vignettes", "--ignore-vignettes", "--no-manual")'
          upload-snapshots: true
