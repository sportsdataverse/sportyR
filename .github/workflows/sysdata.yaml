# Fails if R/sysdata.rda is out of date with data-raw/, e.g. when
# data-raw/surface-dimensions.json is edited but data-raw/internal-datasets.R
# wasn't re-run to rebuild R/sysdata.rda. The comparison lives in
# .github/scripts/check-sysdata.R.
#
# Only runs when the raw data, the built data, or this check change. Use
# "Run workflow" in the Actions tab to force a run
on:
  push:
    branches: [main, master]
    paths: &sysdata-paths
      - "data-raw/**"
      - "R/sysdata.rda"
      - ".github/scripts/check-sysdata.R"
      - ".github/workflows/sysdata.yaml"
  pull_request:
    branches: [main, master]
    paths: *sysdata-paths
  workflow_dispatch:

name: sysdata

permissions:
  contents: read

jobs:
  sysdata:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # data-raw/internal-datasets.R uses jsonlite and usethis, then calls
      # devtools::load_all(), which needs the package's own dependencies
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::jsonlite, any::usethis, any::devtools, local::.

      - name: Check R/sysdata.rda is up to date
        run: Rscript .github/scripts/check-sysdata.R
