# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Only runs when the package code or its tests change, so docs-only and CI-only
# changes skip it. Use "Run workflow" in the Actions tab to force a run
on:
  push:
    branches: [main, master]
    paths: &coverage-paths
      - "R/**"
      - "src/**"
      - "data/**"
      - "tests/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - ".github/workflows/test-coverage.yaml"
  pull_request:
    branches: [main, master]
    paths: *coverage-paths
  workflow_dispatch:

name: test-coverage

# A new push to a pull request cancels that PR's stale run. Other runs (pushes to
# main, manual runs) get their own group so none is dropped from the queue
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    # R and the system libraries come from the image, so setup-r is not needed
    container: rocker/r-ver:latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Test coverage
        run: covr::codecov(quiet = FALSE)
        shell: Rscript {0}
